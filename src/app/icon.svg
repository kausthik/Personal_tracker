<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#fff"/>
  <!-- messy hair with spikes, bangs cut just above the glasses -->
  <path d="M14 32 C11 22 14 13 22 10 L21 5 L28 9 L31 3 L35 9 L42 5 L41 11 C49 13 53 21 50 32
           L46 26 L42 30 L38 25 L33 30 L28 25 L23 30 L19 26 Z" fill="#1f2a44"/>
  <!-- glasses -->
  <g stroke="#1f2a44" stroke-width="3.2" stroke-linejoin="round">
    <rect x="15" y="31" width="15" height="13" rx="4" fill="#fff"/>
    <rect x="34" y="31" width="15" height="13" rx="4" fill="#fff"/>
    <path d="M30 36 H34" fill="none"/>
  </g>
  <!-- eyes -->
  <circle cx="23.5" cy="38" r="2.4" fill="#1f2a44"/>
  <circle cx="40.5" cy="38" r="2.4" fill="#1f2a44"/>
  <!-- code brackets -->
  <g fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 33 L5 38 L10 43"/>
    <path d="M54 33 L59 38 L54 43"/>
  </g>
  <!-- small smile -->
  <path d="M28 51 Q32 54 36 51" fill="none" stroke="#1f2a44" stroke-width="2.4" stroke-linecap="round"/>
</svg>
