<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- shoulders / shirt with collar -->
    <path d="M8 66 C8 52 18 47 32 47 C46 47 56 52 56 66 Z" fill="#1e3a8a"/>
    <path d="M26 47 L32 55 L38 47 Z" fill="#fff"/>
    <!-- neck -->
    <rect x="28" y="40" width="8" height="9" fill="#e0a37a"/>
    <!-- ears -->
    <circle cx="16.5" cy="30" r="3.5" fill="#f1b98f"/>
    <circle cx="47.5" cy="30" r="3.5" fill="#f1b98f"/>
    <!-- face -->
    <ellipse cx="32" cy="29" rx="15" ry="16" fill="#f1b98f"/>
    <!-- hair with side sweep -->
    <path d="M16.5 28 C15 14 23 9 32 9 C42 9 49 14 47.5 28 C45 21 40 18 33 19 C27 20 23 17 22 16 C20 20 18 23 16.5 28 Z" fill="#2b1a12"/>
    <!-- glasses -->
    <g fill="none" stroke="#111827" stroke-width="2.6">
      <rect x="19" y="25" width="11" height="9" rx="3.5" fill="#fff" fill-opacity="0.35"/>
      <rect x="34" y="25" width="11" height="9" rx="3.5" fill="#fff" fill-opacity="0.35"/>
      <path d="M30 28.5 Q32 27 34 28.5"/>
      <path d="M19 28 L16.5 27"/>
      <path d="M45 28 L47.5 27"/>
    </g>
    <!-- eyes -->
    <circle cx="24.5" cy="29.5" r="1.8" fill="#111827"/>
    <circle cx="39.5" cy="29.5" r="1.8" fill="#111827"/>
    <!-- smile -->
    <path d="M27 38 Q32 42 37 38" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
